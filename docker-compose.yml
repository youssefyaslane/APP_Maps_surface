services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - cache_data:/app/cache
    # La base vit sur le serveur PostgreSQL partagé, dans le schéma
    # « solar intelligence ». Les valeurs viennent de .env (modèle versionné :
    # .env.example). Sans elles, docker compose refuse de démarrer avec un
    # message : retomber en silence sur une autre base ferait écrire les toits
    # tracés au mauvais endroit sans que personne ne s'en aperçoive.
    environment:
      PGHOST: "${SOLAR_DB_HOST:?Renseigner SOLAR_DB_HOST dans .env (voir .env.example)}"
      PGPORT: "${SOLAR_DB_PORT:-5432}"
      PGDATABASE: "${SOLAR_DB_NAME:?Renseigner SOLAR_DB_NAME dans .env (voir .env.example)}"
      PGUSER: "${SOLAR_DB_USER:?Renseigner SOLAR_DB_USER dans .env (voir .env.example)}"
      PGPASSWORD: "${SOLAR_DB_PASSWORD:?Renseigner SOLAR_DB_PASSWORD dans .env (voir .env.example)}"
      DB_SCHEMA: "${SOLAR_DB_SCHEMA:?Renseigner SOLAR_DB_SCHEMA dans .env (voir .env.example)}"
      # Clé de chiffrement des mots de passe enregistrés depuis la page
      # Administration → Base de données. Facultative : sans elle, la
      # page refuse d'enregistrer d'autres bases (voir .env.example).
      DB_CONFIG_KEY: "${DB_CONFIG_KEY:-}"
      # Clé Google AI Studio pour scripts/panneaux/detect_panels_gemini.py (toits déjà
      # équipés de panneaux). Facultative : sans elle, seul ce script refuse de
      # tourner. GEMINI_MODEL choisit un autre modèle que celui par défaut.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3-flash-preview}"
      # Confiance à partir de laquelle un toit s'affiche « avec panneaux » dans
      # le tableau de bord (détection : scripts/panneaux/classer_panneaux.sh).
      PV_SEUIL: "${PV_SEUIL:-0.25}"

volumes:
  cache_data:
