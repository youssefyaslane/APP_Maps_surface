<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Netis Prospection solaire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
</head>
<body>
  <main class="login-card">
    <div class="login-head">
      <img class="login-logo" src="{{ url_for('static', filename='img/logo-netis.png') }}" alt="Netis" />
      <h1>Prospection solaire</h1>
      <p class="login-sub">Outil interne Netis — connexion requise</p>
    </div>

    {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}" />
      <label>
        <span>Identifiant</span>
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>
        <span>Mot de passe</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Se connecter</button>
    </form>

    <p class="login-help">Pas de compte ? Demandez-en un à la personne qui administre l'outil.</p>
  </main>
</body>
</html>
