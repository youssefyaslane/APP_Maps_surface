<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carte du Maroc — Surface des bâtiments</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>🇲🇦 Carte du Maroc — Surface des bâtiments</h1>
    <select id="city-select" class="city-select"></select>
    <form id="search-form" class="search-form">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Coordonnées (lat, lon) ou lieu (ville, quartier...)"
        autocomplete="off"
      />
      <button id="search-btn" class="search-btn" type="submit">🔍</button>
    </form>
    <button id="points-select-btn" class="zone-btn" type="button">✏️ Tracer un toit</button>
    <a href="/dashboard" class="zone-btn dashboard-link">☀️ Prospects solaires</a>
    <p class="hint" id="hint">Survolez un bâtiment (OSM) pour voir sa surface, ou cliquez n'importe où pour une détection IA par imagerie satellite.</p>
  </header>

  <div id="map"></div>

  <div id="tooltip" class="tooltip hidden"></div>
  <div id="status" class="status hidden"></div>
  <div id="points-controls" class="points-controls hidden">
    <button id="points-confirm-btn" type="button">✓ Valider</button>
    <button id="points-cancel-btn" type="button">✗ Annuler</button>
  </div>

  <div id="seg-controls" class="points-controls hidden">
    <span id="seg-area" class="seg-area"></span>
    <button id="seg-confirm-btn" type="button">✓ Enregistrer</button>
    <button id="seg-undo-btn" type="button">↩ Annuler le point</button>
    <button id="seg-cancel-btn" type="button">✗ Abandonner</button>
  </div>

  <aside id="company-panel" class="company-panel hidden">
    <button id="company-panel-close" class="company-panel-close" type="button" aria-label="Fermer">✕</button>
    <div id="company-panel-content"></div>
  </aside>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
